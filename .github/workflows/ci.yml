name: Node.js CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest
    
    env:
      IMAGE: junior-devops-app
      CONTAINER: junior-devops-app-ci

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Build Docker image
        run: docker build -t "$IMAGE" .

      - name: Start container
        run: |
          docker run -d \
            --name "$CONTAINER" \
            -p 8080:8080 \
            -e APP_ENV=production \
            -e PORT=8080 \
            "$IMAGE"

      - name: Wait for health
        run: |
          for i in {1..30}; do
            if curl -fsS http://localhost:8080/health; then
              echo "Healthy after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "App never became healthy" >&2
          docker logs "$CONTAINER"
          exit 1

      - name: Stop container
        if: always()
        run: docker rm -f "$CONTAINER" || true


